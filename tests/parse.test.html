<!doctype html>
<meta charset="utf-8">
<title>charmap — 파서 테스트</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 13px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         margin: 0; padding: 20px 24px; background: #fafafa; color: #20242b; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 12px; margin: 0 0 16px; }
  #summary { font-weight: 700; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
  .allpass { background: #e8f3ec; color: #226844; border: 1px solid #bcdcc8; }
  .somefail { background: #fbeaea; color: #8b3a3a; border: 1px solid #e5c2c2; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 4px 0; border-bottom: 1px solid #eceef1; }
  .name { font-weight: 600; }
  .pass .name::before { content: "OK  "; color: #4f8a6b; font-weight: 700; }
  .fail .name::before { content: "FAIL  "; color: #8b3a3a; font-weight: 700; }
  .fail .name { color: #8b3a3a; }
  .msg { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px;
         color: #8b3a3a; white-space: pre-wrap; margin: 2px 0 2px 22px; }
  .hide-pass li.pass { display: none; }
  label { font-size: 12px; color: #4a5058; user-select: none; }
</style>

<h1>charmap — 파서 테스트</h1>
<p class="sub">
  <code>tests/cases.js</code> 를 node 러너와 공유한다. node 없이 <code>python -m http.server 8000</code> 만으로 돈다.
</p>
<p><label><input type="checkbox" id="only-fail"> 실패만 보기</label></p>
<div id="summary">돌리는 중…</div>
<ul id="list"></ul>

<script type="module">
  import { tests } from './cases.js';
  import { makeAsserter } from './assert.js';

  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  let pass = 0, fail = 0;

  for (const [name, fn] of tests) {
    const t = makeAsserter();
    let msgs;
    try {
      fn(t);
      msgs = t.failures;
    } catch (e) {
      msgs = [`던져진 예외: ${e && e.stack ? e.stack : e}`];
    }
    const li = document.createElement('li');
    li.className = msgs.length ? 'fail' : 'pass';
    const n = document.createElement('div');
    n.className = 'name';
    n.textContent = name;
    li.appendChild(n);
    for (const m of msgs) {
      const d = document.createElement('div');
      d.className = 'msg';
      d.textContent = m;
      li.appendChild(d);
    }
    list.appendChild(li);
    msgs.length ? fail++ : pass++;
  }

  summary.textContent = fail
    ? `${pass}/${tests.length} 통과 — ${fail}건 실패`
    : `${pass}/${tests.length} 전부 통과`;
  summary.className = fail ? 'somefail' : 'allpass';
  document.title = `${fail ? `(${fail} 실패) ` : ''}charmap — 파서 테스트`;

  document.getElementById('only-fail').addEventListener('change', (e) => {
    list.classList.toggle('hide-pass', e.target.checked);
  });
</script>
