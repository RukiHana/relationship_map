<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- ↑ 서버가 대개 알아서 붙여주지만 한 줄로 못 박아 둔다(계획서 §3) -->
<meta name="robots" content="noindex, nofollow">
<!-- 데이터가 안 올라가도 주소와 저장소 이름은 검색에 뜬다. robots.txt 와 한 쌍(§1) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- 페이지 자체 확대를 막는다. 확대는 관계도가 직접 다룬다(§7) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="charmap">
<meta name="color-scheme" content="light">
<title>charmap</title>
<link rel="stylesheet" href="src/style.css?v=20260726b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='9' cy='10' r='4' fill='%238a94a3'/><circle cx='23' cy='21' r='4' fill='%235c6675'/><path d='M11 13 L21 18' stroke='%23c2683f' stroke-width='2'/></svg>">
</head>
<body>

<div id="app">

  <header id="topbar">
    <button id="btn-import" class="primary" title="매 작업의 정상적인 시작점입니다">파일 열기</button>
    <button id="btn-paste">붙여넣기</button>
    <button id="btn-export" class="primary">데이터 내보내기</button>
    <span class="pill" id="pill-count">0명 · 0건</span>
    <span class="spacer"></span>
    <button id="btn-undo" title="되돌리기">↶</button>
    <button id="btn-redo" title="다시">↷</button>
    <button id="btn-add">+ 캐릭터</button>
  </header>

  <div id="notices"></div>

  <main id="split">

    <section id="graph-pane">
      <div class="graph" id="graph">
        <div id="viewport">
          <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="labels"></div>
          <div id="nodes"></div>
        </div>

        <!-- 관계 카드 — 읽기 전용. 선 클릭 판정이 완벽하지 않아도 되는 이유가 이것이다(§7) -->
        <div id="card" aria-live="polite"></div>

        <div id="edge-pick"></div>

        <div id="graph-tools">
          <!-- 아이패드에서 관계를 만드는 정식 경로. 켜고 A 탭 → B 탭 (§7) -->
          <button id="btn-connect" title="켜고 두 노드를 차례로 누르면 관계가 만들어집니다">연결</button>
          <button id="btn-showall" title="기본은 노드만. 누르면 선과 라벨 전부">전체 보기</button>
          <button id="btn-fit" title="전부 보이게 맞춤">맞춤</button>
          <button id="btn-collapse-graph" title="관계도 접기">▲</button>
        </div>
      </div>
    </section>

    <div id="divider" role="separator" aria-orientation="horizontal" aria-label="위아래 비율 조절">
      <div class="grip"></div>
    </div>

    <section id="list-pane">
      <div id="text-wrap">
        <!-- 2층 구조: 뒤 pre 가 줄 배경을 칠하고, 글자는 앞 textarea 가 그린다.
             textarea 는 **한 번 만들고 절대 다시 만들지 않는다**(§2 한글 입력 안전) -->
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="src" spellcheck="false" autocapitalize="off" autocorrect="off"
                  placeholder="지나-당옥 : 딸 - 엄마&#10;지나-선 : 짝사랑 -&#10;&#10;# 주석은 이렇게"></textarea>
      </div>
      <div id="list-tools">
        <button id="btn-copy-lines" title="기획서에 바로 붙여넣기">관계 목록 복사</button>
        <button id="btn-collapse-list" title="목록 접기">▼</button>
      </div>
    </section>

  </main>

  <footer id="statusbar">
    <span id="dirty"></span>
    <span id="diagcount"></span>
    <span id="version"></span>
  </footer>

</div>

<div id="modal-back"></div>

<script type="module" src="src/main.js?v=20260726b"></script>
<noscript>이 도구는 자바스크립트가 있어야 돕니다.</noscript>

</body>
</html>
